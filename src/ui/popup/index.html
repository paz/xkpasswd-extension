<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XKPasswd</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <!-- Header -->
      <header class="header">
        <div class="header__content">
          <h1 class="header__title">XKPasswd</h1>
          <p class="header__subtitle">Generate secure, memorable passwords</p>
        </div>
        <button id="open-options" class="btn-icon" type="button" aria-label="Open settings" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </button>
      </header>

      <!-- Quick Generate Section -->
      <section class="quick-generate">
        <div class="preset-selector">
          <label for="preset" class="preset-label">
            <span class="label-text">Preset</span>
            <select id="preset" class="select-input"></select>
          </label>
          <p id="preset-description" class="preset-description"></p>
        </div>

        <div class="quick-options">
          <label class="quick-option">
            <span>Passwords</span>
            <input id="num-passwords" class="quick-input" type="number" min="1" max="20" />
          </label>
          <label class="quick-option">
            <span>Words</span>
            <input id="num-words" class="quick-input" type="number" min="2" max="10" />
          </label>
        </div>

        <button id="generate" class="btn-primary" type="button">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M13.5 2.5v5h-5M2.5 13.5v-5h5M13 3a6.5 6.5 0 11-10 5.5" />
          </svg>
          <span>Generate Passwords</span>
        </button>
      </section>

      <!-- Password Results -->
      <section class="results" aria-labelledby="results-title">
        <div class="results__header">
          <h2 id="results-title" class="results__title">Generated Passwords</h2>
          <button id="copy-all" class="btn-secondary btn-sm" type="button" hidden>
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="5" y="5" width="9" height="9" rx="1" />
              <path d="M2 11V3a1 1 0 011-1h8" />
            </svg>
            <span>Copy All</span>
          </button>
        </div>

        <div id="empty-state" class="empty-state">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M24 12v24M12 24h24" />
          </svg>
          <p>Click "Generate Passwords" to begin</p>
        </div>

        <ul id="password-list" class="password-list" hidden></ul>

        <!-- Strength Indicator -->
        <div id="strength-indicator" class="strength-indicator" hidden>
          <div class="strength-indicator__header">
            <span class="strength-indicator__label">Password Strength</span>
            <span id="strength-label" class="strength-indicator__value"></span>
          </div>
          <div class="strength-indicator__bar">
            <div id="strength-bar-fill" class="strength-indicator__fill"></div>
          </div>
          <div class="strength-indicator__details">
            <span id="entropy-display" class="strength-detail"></span>
            <span id="crack-time" class="strength-detail"></span>
          </div>
        </div>
      </section>

      <!-- Validation Message -->
      <div id="validation" class="validation-message" role="alert" hidden></div>

      <!-- Toast Notification -->
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </main>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
