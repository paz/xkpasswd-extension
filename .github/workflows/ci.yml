name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run smoke tests
        run: npm run test:smoke
      - name: Build
        run: npm run build
      - name: Package extension zips
        run: |
          cd dist/chromium
          zip -r ../../xkpasswd-chromium.zip .
          cd ../firefox
          zip -r ../../xkpasswd-firefox.zip .
      - name: Upload extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: |
            xkpasswd-chromium.zip
            xkpasswd-firefox.zip
